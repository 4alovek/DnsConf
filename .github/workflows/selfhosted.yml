name: Update self-hosted GeoHide filter
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: selfhosted-filter
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment: DNS
    steps:
      - uses: actions/checkout@v5
        if: vars.DNS == 'SELFHOSTED'
      - uses: actions/setup-python@v5
        if: vars.DNS == 'SELFHOSTED'
        with:
          python-version: '3.12'
      - name: Build complete filter
        if: vars.DNS == 'SELFHOSTED'
        env:
          REDIRECT: ${{ vars.REDIRECT }}
          BLOCK: ${{ vars.BLOCK }}
          EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}
          DONOR_DNS: ${{ vars.DONOR_DNS }}
        run: |
          python -m unittest discover -s tests
          python selfhosted/build_filter.py
      - name: Publish changed filter
        if: vars.DNS == 'SELFHOSTED'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selfhosted/geohide-filter.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update self-hosted GeoHide filter'
          git push
